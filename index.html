<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gemma Studio CLI</title>
    <style>
        body { background: #0d0b0a; color: #d4c4b7; font-family: sans-serif; display: flex; justify-content: center; margin: 0; }
        .chat-container { width: 100%; max-width: 600px; height: 100vh; display: flex; flex-direction: column; background: #181412; }
        #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .bubble { padding: 10px; border-radius: 10px; font-size: 14px; max-width: 80%; }
        .user { align-self: flex-end; background: #e87645; color: white; }
        .ai { align-self: flex-start; background: #1f1a17; border: 1px solid #333; }
        .input-area { padding: 20px; background: #111; display: flex; gap: 10px; }
        input { flex: 1; background: #000; border: 1px solid #333; color: white; padding: 10px; border-radius: 5px; }
        button { background: #e87645; border: none; color: white; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div id="log"></div>
        <div class="input-area">
            <input type="text" id="prompt" placeholder="Escribe a Gemma-3...">
            <button onclick="enviar()">ENVIAR</button>
        </div>
    </div>

    <script>
        // REEMPLAZA ESTA URL con la URL de tu Worker de Cloudflare
        const WORKER_URL = "https://tu-worker.tu-usuario.workers.dev";

        async function enviar() {
            const input = document.getElementById('prompt');
            const log = document.getElementById('log');
            const texto = input.value;
            if(!texto) return;

            // Mostrar mensaje usuario
            log.innerHTML += `<div class="bubble user">${texto}</div>`;
            input.value = "";

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    body: JSON.stringify({ prompt: texto })
                });
                
                const data = await response.json();
                // Gemma-3 devuelve la respuesta en data.result.response
                const respuestaIA = data.result.response;
                
                log.innerHTML += `<div class="bubble ai">${respuestaIA}</div>`;
                log.scrollTop = log.scrollHeight;
            } catch (e) {
                log.innerHTML += `<div class="bubble ai" style="color:red">Error: ${e.message}</div>`;
            }
        }
    </script>
</body>
</html>
