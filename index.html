<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Studio - Cloudflare</title>
    <style>
        :root {
            --bg: #0d0b0a;
            --panel: #181412;
            --accent: #e87645;
            --text: #d4c4b7;
            --ai-bubble: #1f1a17;
            --user-bubble: #e87645;
            --border: #333;
        }

        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; height: 100vh;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center;
        }

        .chat-app {
            width: 100%; max-width: 800px;
            display: flex; flex-direction: column;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            background: var(--panel);
        }

        .header {
            padding: 20px;
            background: #111;
            border-bottom: 1px solid var(--border);
            text-align: center;
            font-weight: bold;
            color: var(--accent);
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        #chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .ai {
            align-self: flex-start;
            background: var(--ai-bubble);
            color: var(--text);
            border-bottom-left-radius: 2px;
            border: 1px solid #2a2a2a;
        }

        .user {
            align-self: flex-end;
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .system {
            align-self: center;
            background: #222;
            color: #888;
            font-size: 0.8rem;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .input-container {
            padding: 20px;
            background: #111;
            border-top: 1px solid var(--border);
            display: flex; gap: 10px;
        }

        input {
            flex: 1;
            background: #000;
            border: 1px solid var(--border);
            color: white;
            padding: 12px 15px;
            border-radius: 25px;
            outline: none;
        }

        button {
            background: var(--accent);
            border: none;
            color: white;
            padding: 0 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        #typing {
            font-size: 0.8rem;
            color: #666;
            margin: 5px 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="chat-app">
    <div class="header">GEMINI STUDIO</div>
    <div id="chat-log">
        <div class="bubble ai">Sistema cargado. Listo para ejecutar tareas y comandos en Cloudflare.</div>
    </div>
    <div id="typing">La IA está procesando...</div>
    <div class="input-container">
        <input type="text" id="user-input" placeholder="Escribe tu comando o mensaje..." autofocus>
        <button id="send-btn">ENVIAR</button>
    </div>
</div>

<script>
    const chatLog = document.getElementById('chat-log');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing');

    // Endpoint de la API (Ajustar según tu configuración de Workers)
    const API_URL = '/api/chat'; 

    function addMessage(role, text) {
        const msg = document.createElement('div');
        msg.className = `bubble ${role}`;
        msg.innerText = text;
        chatLog.appendChild(msg);
        chatLog.scrollTop = chatLog.scrollHeight;
    }

    async function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage('user', text);
        userInput.value = '';
        typingIndicator.style.display = 'block';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: text })
            });

            const data = await response.json();
            typingIndicator.style.display = 'none';

            if (data.response) {
                addMessage('ai', data.response);
                
                // Detectar comandos automáticos
                const cmdMatch = data.response.match(/<cmd>(.*?)<\\/cmd>/);
                if (cmdMatch) {
                    if (confirm("¿Ejecutar comando: " + cmdMatch[1] + "?")) {
                        executeCommand(cmdMatch[1]);
                    }
                }
            }
        } catch (err) {
            typingIndicator.style.display = 'none';
            addMessage('system', 'Error de conexión.');
        }
    }

    async function executeCommand(command) {
        addMessage('system', 'Ejecutando localmente...');
        try {
            const res = await fetch('/api/exec', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: command })
            });
            const result = await res.json();
            addMessage('system', 'Respuesta terminal: ' + (result.output || result.error));
        } catch (e) {
            addMessage('system', 'Error al ejecutar.');
        }
    }

    sendBtn.onclick = handleSend;
    userInput.onkeydown = (e) => { if (e.key === 'Enter') handleSend(); };
</script>

</body>
</html>
